<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AOR Fleet Status Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0f17;
    --panel:#111827;
    --panel-border:#1f2937;
    --ink:#e5e9f0;
    --ink-muted:#8a93a6;
    --ink-dim:#5b6472;
    --tile-gap:7px;

    --good:#1fa550;
    --good-light:#33d96f;
    --good-dark:#12602f;
    --good-ink:#eafff1;
    --warn:#e8a317;
    --warn-light:#eebd58;
    --warn-dark:#9e6f10;
    --warn-ink:#1a1200;
    --crit:#c0392b;
    --crit-light:#da6559;
    --crit-dark:#7d251c;
    --crit-ink:#fff0ee;
    --oos:#6b7686;
    --oos-light:#919aa7;
    --oos-dark:#474e59;
    --oos-ink:#f2f4f7;
    --maint:#2f6fbf;
    --maint-light:#5b96e0;
    --maint-dark:#1f4a80;
    --maint-ink:#eaf3ff;

    --focus:#4da3ff;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    max-width:2200px;
    margin:0 auto;
    padding:22px 28px 28px;
  }

  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:18px;
  }

  .title-block{
    display:flex;
    align-items:center;
    gap:16px;
  }

  .title-block .logo{
    height:56px;
    width:auto;
    display:block;
    flex-shrink:0;
  }

  .title-block h1{
    margin:0;
    font-size:36px;
    font-weight:800;
    letter-spacing:.2px;
  }

  .title-block p{
    margin:4px 0 0;
    color:var(--ink-muted);
    font-size:13px;
  }

  @media (max-width:640px){
    .title-block .logo{ height:40px; }
  }

  .badges{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }

  .badge{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:8px 14px;
    font-size:14px;
    font-weight:600;
  }

  .badge .dot{
    width:10px; height:10px; border-radius:50%; flex:none;
  }

  .badge .count{
    color:var(--ink-muted);
    font-weight:700;
    margin-left:2px;
  }

  .dot.good{ background:var(--good); }
  .dot.warn{ background:var(--warn); }
  .dot.crit{ background:var(--crit); }
  .dot.oos{ background:var(--oos); }
  .dot.maint{ background:var(--maint); }

  .kpi-bottom{
    display:grid;
    grid-template-columns:repeat(5, 1fr);
    gap:12px;
    margin-top:18px;
  }
  .kpi-card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .kpi-card .kpi-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--ink-muted);
  }
  .kpi-card .kpi-value{ font-size:34px; font-weight:800; line-height:1; }
  .kpi-card.failure .kpi-value{ color:#ff6b5e; }
  .kpi-card.review .kpi-value{ color:#f2b93b; }
  .kpi-card.maintenance .kpi-value{ color:#5b96e0; }
  .kpi-card.out_of_service .kpi-value{ color:#c3c9d4; }
  .kpi-card.healthy .kpi-value{ color:#3fd679; }

  @media (max-width:900px){
    .kpi-bottom{ grid-template-columns:repeat(3, 1fr); }
  }
  @media (max-width:640px){
    .kpi-bottom{ grid-template-columns:repeat(2, 1fr); }
  }

  /*
   * ── TABS (Tiles / List) ──────────────────────────────────────────────
   * Two views over the exact same live data (lastUnitsByTu) — the grid of
   * annunciator tiles, or a flat table of every alarm. Switching tabs never
   * re-fetches anything; render() populates both on every poll regardless
   * of which one is currently visible, so switching to List always shows
   * the latest data, not a stale snapshot from whenever it was last shown.
   */
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:14px;
    border-bottom:1px solid var(--panel-border);
  }
  .tab-btn{
    appearance:none;
    background:transparent;
    border:none;
    border-bottom:2px solid transparent;
    color:var(--ink-muted);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    padding:10px 6px;
    cursor:pointer;
    transition:color .1s ease, border-color .1s ease;
  }
  .tab-btn:hover{ color:var(--ink); }
  .tab-btn[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--focus); }
  .tab-panel[hidden]{ display:none; }

  .alarm-table-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:12px;
  }
  .alarm-table-summary{ font-size:13px; color:var(--ink-muted); }
  .alarm-table-summary strong{ color:var(--ink); }
  .alarm-table-actions{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .alarm-filter{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .alarm-filter button{
    appearance:none;
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--ink-muted);
    border-radius:7px;
    padding:5px 11px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .alarm-filter button:hover{ color:var(--ink); }
  .alarm-filter button[aria-pressed="true"]{ color:var(--ink); border-color:var(--focus); background:rgba(77,163,255,.12); }

  .alarm-table-scroll{
    overflow-x:auto;
    border:1px solid var(--panel-border);
    border-radius:10px;
  }
  table.alarm-table{
    width:100%;
    border-collapse:collapse;
    font-size:13.5px;
  }
  table.alarm-table thead th{
    text-align:left;
    padding:10px 14px;
    background:var(--panel);
    color:var(--ink-muted);
    font-size:11px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    border-bottom:1px solid var(--panel-border);
    white-space:nowrap;
    position:sticky;
    top:0;
  }
  table.alarm-table tbody tr{
    border-bottom:1px solid var(--panel-border);
    cursor:pointer;
  }
  table.alarm-table tbody tr:last-child{ border-bottom:none; }
  table.alarm-table tbody tr:hover{ background:rgba(255,255,255,.03); }
  table.alarm-table td{
    padding:10px 14px;
    vertical-align:top;
  }
  table.alarm-table .al-tu{ font-weight:700; white-space:nowrap; }
  table.alarm-table .al-sev{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-weight:700;
    font-size:12.5px;
    white-space:nowrap;
  }
  table.alarm-table .al-sev .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  table.alarm-table .al-msg{ color:var(--ink-muted); }
  table.alarm-table .al-ack{
    display:inline-block;
    padding:2px 9px;
    border-radius:20px;
    font-size:11.5px;
    font-weight:700;
    white-space:nowrap;
  }
  table.alarm-table .al-ack.yes{ background:rgba(31,165,80,.16); color:#3fd679; }
  table.alarm-table .al-ack.no{ background:rgba(192,57,43,.16); color:#ff9d94; }
  .alarm-table-empty{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-dim);
    font-style:italic;
  }

  .demo-flag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#ffcf6e;
    background:rgba(232,163,23,.12);
    border:1px solid rgba(232,163,23,.35);
    border-radius:6px;
    padding:4px 8px;
  }

  .header-actions{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }

  .btn-manual{
    display:flex;
    align-items:center;
    gap:7px;
    background:var(--panel);
    border:1px solid var(--panel-border);
    color:var(--ink);
    border-radius:8px;
    padding:9px 15px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-manual:hover{ border-color:var(--focus); color:#cfe4ff; }

  .manual-badge{
    position:absolute;
    top:5px;
    left:5px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:rgba(0,0,0,.32);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    line-height:1;
  }

  .form-row{ margin-bottom:14px; }
  .form-row label{
    display:block;
    font-size:12px;
    font-weight:700;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin-bottom:6px;
  }
  .form-row input[type="text"],
  .form-row textarea{
    width:100%;
    background:#0c1018;
    border:1px solid var(--panel-border);
    border-radius:8px;
    color:var(--ink);
    padding:9px 11px;
    font-size:13.5px;
    font-family:inherit;
    resize:vertical;
  }
  .form-row input[type="text"]:focus,
  .form-row textarea:focus{ outline:none; border-color:var(--focus); }

  .status-choice{ display:flex; gap:8px; }
  .status-choice label{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:9px 8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    text-transform:none;
    letter-spacing:0;
    color:var(--ink);
  }
  .status-choice input{ margin:0; accent-color:var(--focus); }
  .status-choice label.sel-review{ border-color:rgba(232,163,23,.5); }
  .status-choice label.sel-oos{ border-color:rgba(107,118,134,.6); }

  .manage-list{ margin-top:18px; border-top:1px solid var(--panel-border); padding-top:14px; }
  .manage-list h3{
    font-size:11px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin:0 0 10px;
  }
  .manage-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 0;
    border-bottom:1px solid var(--panel-border);
    font-size:13px;
  }
  .manage-row:last-child{ border-bottom:none; }
  .manage-row .mr-tu{ font-weight:700; width:56px; flex:none; }
  .manage-row .mr-status{ flex:none; }
  .manage-row .mr-status.review{ color:#f2b93b; }
  .manage-row .mr-status.out_of_service{ color:#c3c9d4; }
  .manage-row .mr-desc{ flex:1; color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .manage-row .mr-clear{
    flex:none;
    background:transparent;
    border:1px solid var(--panel-border);
    color:var(--ink-muted);
    border-radius:6px;
    padding:4px 9px;
    font-size:12px;
    cursor:pointer;
  }
  .manage-row .mr-clear:hover{ color:#ff6b5e; border-color:#ff6b5e; }
  .manage-empty{ color:var(--ink-dim); font-size:13px; font-style:italic; }

  .underlying-block{
    background:#0c1018;
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:16px;
    font-size:12.5px;
    color:var(--ink-muted);
  }
  .underlying-block strong{ color:var(--ink); }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(108px, 1fr));
    gap:9px;
    margin-bottom:18px;
  }

  .tile{
    position:relative;
    aspect-ratio:1.3 / 1;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:17px;
    font-weight:700;
    letter-spacing:.2px;
    cursor:pointer;
    outline:none;
    border:1px solid rgba(0,0,0,.3);
    box-shadow:
      0 3px 6px rgba(0,0,0,.35),
      inset 0 1px 0 rgba(255,255,255,.28),
      inset 0 -3px 6px rgba(0,0,0,.22);
    transition:transform .08s ease, box-shadow .08s ease, filter .08s ease;
  }

  .tile:hover, .tile:focus-visible{
    transform:translateY(-2px);
    filter:brightness(1.08);
    box-shadow:
      0 6px 12px rgba(0,0,0,.4),
      inset 0 1px 0 rgba(255,255,255,.32),
      inset 0 -3px 6px rgba(0,0,0,.22),
      0 0 0 2px var(--focus);
    z-index:2;
  }

  .tile:active{
    transform:translateY(1px);
    filter:brightness(0.94);
    box-shadow:
      0 1px 2px rgba(0,0,0,.35),
      inset 0 2px 5px rgba(0,0,0,.35);
  }

  .tile.healthy{
    background:linear-gradient(155deg, var(--good-light) 0%, var(--good) 55%, var(--good-dark) 100%);
    color:var(--good-ink);
    border-color:var(--good-dark);
  }
  .tile.review{
    background:linear-gradient(155deg, var(--warn-light) 0%, var(--warn) 55%, var(--warn-dark) 100%);
    color:var(--warn-ink);
    border-color:var(--warn-dark);
  }
  .tile.failure{
    background:linear-gradient(155deg, var(--crit-light) 0%, var(--crit) 55%, var(--crit-dark) 100%);
    color:var(--crit-ink);
    border-color:var(--crit-dark);
  }
  .tile.maintenance{
    background:linear-gradient(155deg, var(--maint-light) 0%, var(--maint) 55%, var(--maint-dark) 100%);
    color:var(--maint-ink);
    border-color:var(--maint-dark);
  }
  /*
   * Out of service ALWAYS renders gray, regardless of what any Live_Alarms
   * record for that unit says — see loadFleet(): an out_of_service unit is
   * decided (roster pin, manual override, or shared-file seed) before any
   * live alarm is even looked at, so this class and the severity classes
   * above are mutually exclusive by construction, not just by CSS order.
   */
  .tile.out_of_service{
    background:linear-gradient(155deg, var(--oos-light) 0%, var(--oos) 55%, var(--oos-dark) 100%);
    color:var(--oos-ink);
    border-color:var(--oos-dark);
  }

  /*
   * ── FLASHING ALARM LIGHTS ────────────────────────────────────────────
   * Any tile showing failure (red), review (amber), or maintenance (blue)
   * is, by construction, an unacknowledged/active alarm — a unit only ever
   * carries one of these three classes when it has at least one alarm that
   * isn't acknowledged (see pickWorstActiveAlarm() in the main script), so
   * the tile's own status class is already exactly the signal needed here
   * — no separate "is this new/unacknowledged" tracking required. A
   * ::after glow ring is animated (not the tile's own box-shadow) so the
   * 3D depth shadow and the hover/focus ring above are untouched by the
   * flash. Failure flashes fastest, then review, then maintenance slowest
   * — the usual "more urgent = faster blink" annunciator convention.
   * Stops the instant every alarm on that unit is acknowledged or clears.
   */
  .tile.failure::after,
  .tile.review::after,
  .tile.maintenance::after{
    content:'';
    position:absolute;
    inset:-3px;
    border-radius:12px;
    pointer-events:none;
    box-shadow:0 0 0 3px currentColor, 0 0 16px 4px currentColor;
    opacity:0;
  }
  .tile.failure::after{ color:var(--crit); animation:tile-flash .9s steps(1,end) infinite; }
  .tile.review::after{ color:var(--warn); animation:tile-flash 1.6s steps(1,end) infinite; }
  .tile.maintenance::after{ color:var(--maint); animation:tile-flash 2.2s steps(1,end) infinite; }

  @keyframes tile-flash{
    0%, 49%{ opacity:.95; }
    50%, 100%{ opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .tile.failure::after, .tile.review::after, .tile.maintenance::after{ animation:none; opacity:.55; }
  }

  .ack-badge{
    position:absolute;
    top:5px;
    right:5px;
    width:16px;
    height:16px;
    border-radius:50%;
    background:rgba(0,0,0,.32);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    line-height:1;
  }

  .tooltip{
    position:fixed;
    pointer-events:none;
    background:#080b12;
    border:1px solid var(--panel-border);
    color:var(--ink);
    padding:10px 12px;
    border-radius:8px;
    font-size:12.5px;
    line-height:1.45;
    max-width:280px;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    opacity:0;
    transform:translateY(4px);
    transition:opacity .1s ease, transform .1s ease;
    z-index:50;
  }
  .tooltip.show{ opacity:1; transform:translateY(0); }
  .tooltip .tt-tu{ font-weight:700; font-size:13px; margin-bottom:2px; }
  .tooltip .tt-status{ font-weight:600; margin-bottom:4px; }
  .tooltip .tt-status.healthy{ color:#3fd679; }
  .tooltip .tt-status.review{ color:#f2b93b; }
  .tooltip .tt-status.failure{ color:#ff6b5e; }
  .tooltip .tt-status.maintenance{ color:#5b96e0; }
  .tooltip .tt-status.out_of_service{ color:#aeb6c2; }
  .tooltip .tt-msg{ color:var(--ink-muted); }
  .tooltip .tt-alarm-list{ margin:2px 0 0; padding:0; list-style:none; }
  .tooltip .tt-alarm-item{
    padding:6px 0;
    border-top:1px solid rgba(255,255,255,.1);
  }
  .tooltip .tt-alarm-item:first-child{ border-top:none; }
  .tooltip .tt-alarm-sev{ font-weight:700; font-size:11.5px; }
  .tooltip .tt-alarm-sev.failure{ color:#ff6b5e; }
  .tooltip .tt-alarm-sev.review{ color:#f2b93b; }
  .tooltip .tt-alarm-sev.maintenance{ color:#5b96e0; }
  .tooltip .tt-alarm-ack{ color:var(--ink-dim); font-weight:600; }

  .ticker-panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:10px;
    padding:14px 18px;
  }

  .ticker-head{
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-muted);
    margin-bottom:10px;
  }

  .ticker-head .n{ color:var(--ink); }

  .ticker-body{
    display:flex;
    flex-wrap:wrap;
    gap:8px 0;
    font-size:13.5px;
    line-height:1.6;
  }

  .ticker-body .empty{ color:var(--ink-dim); font-style:italic; }

  .alert-item{ white-space:nowrap; }
  .alert-item .tu{ font-weight:700; }
  .alert-item.failure .tu{ color:#ff6b5e; }
  .alert-item.review .tu{ color:#f2b93b; }
  .alert-item.maintenance .tu{ color:#5b96e0; }
  .alert-item .msg{ color:var(--ink-muted); }
  .sep{ color:var(--ink-dim); margin:0 12px; }

  .load-error{
    background:var(--panel);
    border:1px solid var(--crit);
    border-radius:10px;
    padding:16px 18px;
    color:#ffb3aa;
    font-size:13.5px;
    line-height:1.6;
    margin-bottom:18px;
  }
  .load-error code{
    background:#000;
    padding:1px 6px;
    border-radius:4px;
    color:#eee;
  }
  .load-error.warn{
    border-color:var(--warn);
    color:#ffe1a6;
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(4,6,10,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
  }
  .modal-overlay[hidden]{ display:none; }

  .modal{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:22px 24px;
    width:100%;
    max-width:400px;
    /* A unit with several active alarms (see "modal-alarm-list" below) can
       render taller than the viewport — without a cap + scroll here, the
       Acknowledge button at the bottom becomes unreachable, nothing on the
       page scrolls to get to it. Capped to the overlay's own 20px padding
       (see .modal-overlay above) so the modal never touches the viewport
       edges, and scrolls internally once its content doesn't fit. */
    max-height:calc(100vh - 40px);
    overflow-y:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    position:relative;
  }

  .modal-close{
    position:absolute;
    top:12px; right:12px;
    width:28px; height:28px;
    border-radius:6px;
    border:none;
    background:transparent;
    color:var(--ink-muted);
    font-size:18px;
    line-height:1;
    cursor:pointer;
  }
  .modal-close:hover{ background:rgba(255,255,255,.08); color:var(--ink); }

  .modal-tu{ font-size:22px; font-weight:700; margin:0 0 4px; }

  .modal-status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:3px 9px;
    border-radius:6px;
    margin-bottom:14px;
  }
  .modal-status.healthy{ background:rgba(31,165,80,.16); color:#3fd679; }
  .modal-status.review{ background:rgba(232,163,23,.16); color:#f2b93b; }
  .modal-status.failure{ background:rgba(192,57,43,.18); color:#ff6b5e; }
  .modal-status.maintenance{ background:rgba(47,111,191,.2); color:#5b96e0; }
  .modal-status.out_of_service{ background:rgba(107,118,134,.2); color:#c3c9d4; }

  .modal-alarm-list{ margin-bottom:16px; display:flex; flex-direction:column; gap:8px; }
  .modal-alarm-list .modal-detail{ margin-bottom:0; }
  .modal-alarm-list .alarm-sev{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  .modal-alarm-list .alarm-sev.failure{ color:#ff6b5e; }
  .modal-alarm-list .alarm-sev.review{ color:#f2b93b; }
  .modal-alarm-list .alarm-sev.maintenance{ color:#5b96e0; }
  .modal-alarm-list .alarm-ack{ color:var(--ink-dim); font-weight:600; font-size:11.5px; }

  .modal-detail{
    background:#0c1018;
    border:1px solid var(--panel-border);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:16px;
  }
  .modal-detail .code{ font-weight:700; margin-bottom:4px; }
  .modal-detail .msg{ color:var(--ink-muted); font-size:13.5px; line-height:1.5; }
  .modal-empty{ color:var(--ink-dim); font-size:13.5px; margin-bottom:16px; }

  .modal-ack-note{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:#3fd679;
    margin-bottom:16px;
  }

  .modal-actions{ display:flex; gap:10px; }

  .btn{
    flex:1;
    padding:10px 14px;
    border-radius:8px;
    border:1px solid var(--panel-border);
    background:transparent;
    color:var(--ink);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    transition:filter .1s ease;
  }
  .btn:hover{ filter:brightness(1.15); }
  .btn:disabled{ opacity:.55; cursor:default; }

  .btn-ack{ background:var(--crit); border-color:var(--crit); color:#fff0ee; }
  .btn-unack{ background:transparent; }

  .modal-error{
    color:#ffb3aa;
    font-size:12.5px;
    line-height:1.5;
    margin-top:12px;
  }

  footer{
    margin-top:14px;
    color:var(--ink-dim);
    font-size:11.5px;
  }

  @media (max-width:640px){
    .grid{ grid-template-columns:repeat(auto-fill, minmax(78px, 1fr)); }
    .tile{ font-size:14px; }
    .title-block h1{ font-size:28px; }
  }
</style>
</head>

<script>
/*
 * ── ROSTER (which TUs exist at all) ─────────────────────────────────────
 * Two ways this panel gets its unit roster, tried in order:

 * 1. window.__FLEET_DATA__ — set by data/units.js (loaded via <script src>
 *    above). Placeholder/demo data (see its "_meta" block) generated from
 *    TU_LIST.xlsx. Add units by editing data/units.js.
 *
 * 2. fetch(DATA_URL) — used only as a fallback, when data/units.js isn't
 *    present. Point DATA_URL at a static file or API that returns the
 *    shape documented in README.md → "Data contract".
 *
 * If BACK4APP_CONFIG below is filled in, each unit's status/alert is then
 * OVERLAID from live Back4App data: severity/fault info from Live_Alarms
 * (see "LIVE STATUS" further down), and Out of Service from the TU_Status
 * class (see "OUT OF SERVICE (TU_Status)" further down) — that TU_Status
 * overlay is the single source of truth for Out of Service once Back4App
 * is configured, taking precedence over everything else, including a unit
 * pinned to `out_of_service` directly in the roster. The roster's own
 * `status`/`alert_*` fields (including such a pin) are only used as the
 * fallback when Back4App isn't configured, a fetch fails, or TU_Status has
 * no STOP=true record for that TU.
 */
const DATA_URL = './data/units.json';

/*
 * ── LIVE STATUS (Back4App) ──────────────────────────────────────────────
 * Same pattern as atenea_dashboard.html's Back4App sync: paste your own
 * Application ID / JavaScript Key below (Back4App dashboard → App
 * Settings → Security & Keys). Leave either blank and this is fully
 * disabled — no network calls, no errors — and the panel just renders
 * whatever's in the roster above, same as before this feature existed.
 *
 * Severity mapping: L1 → red (failure). MA → blue (Maintenance Alert —
 * informational, lowest urgency of the three). Any other non-empty
 * severity (L2, L3, …) or an alarm record with no readable severity →
 * amber (review required). A TU with no matching Live_Alarms record, or
 * whose only alarm(s) are all acknowledged → healthy. A TU that's Out of
 * Service is always gray, regardless of what any alarm says — see
 * "Out of service" in loadFleet() below, that check happens before any
 * alarm is even looked at.
 *
 * MULTIPLE ALARMS PER UNIT: a unit can have more than one active
 * Live_Alarms record at once (e.g. an L1 and an MA together). The tile's
 * own color always reflects the single worst unacknowledged one
 * (pickWorstActiveAlarm(), failure > review > maintenance), but every
 * alarm for that unit is kept (not just the worst) and shown as a list on
 * hover — see attachTooltips() — and in that unit's detail modal.
 *
 * FIELD NAMES: confirmed against the real Live_Alarms schema (exported
 * from Back4App — className "Live_Alarms" — 2026-08-25): tu, severity,
 * alarmId, description/message are all real fields, so these map straight
 * to them. Each is still a list tried in order (first present wins) as a
 * safety net in case the schema changes later — if nothing in a fetched
 * record matches, that record is skipped and a warning banner +
 * console.warn (with the raw record) show up instead of silently
 * rendering everyone as healthy. The schema also has actionRequired
 * (Boolean), location, group/alarmGroup — not used here since the ask was
 * severity-only red/amber, but they're there if this needs to grow later.
 */
const BACK4APP_CONFIG = {
  appId: '9xUYm76BkdVDhSfkvYvehb1QcpAEnnmaehvEmNio',
  jsKey: 'OPQgUuKKwpvGbgHybL3d5zVfUXfiXlts5Fi9WoNM'
};
const LIVE_ALARMS_FIELDS = {
  tu: ['tu'],
  severity: ['severity'],
  // "code" is the short label shown next to the TU in the ticker (e.g.
  // "AM103 — …") and "message" is the longer tooltip detail. Schema has
  // both `description` and `message` as free-text fields with no sample
  // data to confirm which is the short readable one — defaulting to
  // description first for the short label, alarmId as a last-resort ID if
  // description is ever blank. Swap the order below if it reads backwards
  // once real data flows (e.g. ticker shows a raw ID instead of text, or
  // the tooltip repeats the ticker label verbatim).
  code: ['description', 'alarmId'],
  message: ['message', 'description'],
  // A record with this field set to "off" (or false/0) is suppressed —
  // fetched from Back4App but never shown, as if the alarm didn't exist.
  // Missing entirely = shown (only an explicit "off" hides it).
  flag: ['flag'],
  // Acknowledgment now lives directly on the Live_Alarms record itself
  // (see "ACKNOWLEDGING FAULTS" below for why) — this is the field
  // read/written for that. Swap the name here if the real schema differs.
  acknowledged: ['acknowledged'],
  // When Back4App received/processed this alarm — a Parse Date field.
  // Shown as its own column in the List tab and carried into every CSV
  // download (List tab export, Reset Alarms, Acknowledgment report) so
  // there's a record of when each alarm actually happened, not just when
  // it was exported/acknowledged. See normalizeAteneaTimestamp() below —
  // a raw REST fetch returns a Date field as { __type: "Date", iso: "…" },
  // not a plain string, so that's read either way.
  atenea_timestamp: ['AteneaTimestamp', 'ateneaTimestamp']
};

/*
 * ── OUT OF SERVICE (TU_Status) ───────────────────────────────────────────
 * A separate Parse class from Live_Alarms. One row per TU that's ever been
 * touched: TU (the unit code), STOP (Boolean — true means pulled from
 * service), REASON (free text — why). Same tolerant field-name matching as
 * LIVE_ALARMS_FIELDS, in case the real schema's casing differs.
 *
 * A TU with STOP=true here is shown Out of Service everywhere in the panel
 * — gray tile, "Out of service" in the KPI/list/CSV/daily-reset, REASON as
 * its description — regardless of any Live_Alarms record or roster status.
 * This is the ONLY source for Out of Service once Back4App is configured;
 * see applyManualOverride() for the full precedence chain and "Set unit
 * status" (renderManageBody()) for how that button writes here.
 */
const TU_STATUS_FIELDS = {
  tu: ['TU', 'tu'],
  stop: ['STOP', 'stop'],
  reason: ['REASON', 'reason']
};
const LIVE_REFRESH_MS = 30000; // matches atenea_dashboard.html's own poll interval

const STATUS_LABEL = {
  healthy: 'Healthy',
  review: 'Review required',
  failure: 'In failure',
  maintenance: 'Maintenance Alert',
  out_of_service: 'Out of service'
};

// Worst-first. Used to pick which of a unit's several active alarms drives
// the tile's color (see pickWorstActiveAlarm()) and to order the badges/KPI
// cards consistently with that same severity — failure is the most urgent,
// maintenance the least (it's informational, not a fault in progress).
const STATUS_ORDER = ['failure', 'review', 'maintenance', 'out_of_service', 'healthy'];
const SEVERITY_PRIORITY = { failure: 3, review: 2, maintenance: 1 };
const STATUS_DOT_CLASS = { failure: 'crit', review: 'warn', maintenance: 'maint', out_of_service: 'oos', healthy: 'good' };

let liveRefreshTimer = null;
let lastUnitsByTu = {};

// Most recently fetched TU_Status records, keyed by TU: { stop, reason,
// object_id }. Populated by loadFleet() on every refresh; read by
// applyManualOverride() (to decide a unit's Out of Service status) and by
// renderManageBody()/renderModalBody() (to prefill and to know which
// objectId to PUT when clearing). Empty when Back4App isn't configured.
let lastTuStatusByTu = {};

// Only used when Back4App isn't configured (or a fetch fails) — lets the
// acknowledge feature still be tried out against the demo roster, but it's
// session-only and resets on reload. See "Acknowledging faults" in README.md.
let localAckOverrides = {};

function suppressIfAcknowledged(rawStatus, acknowledged) {
  return acknowledged && (rawStatus === 'failure' || rawStatus === 'review' || rawStatus === 'maintenance') ? 'healthy' : rawStatus;
}

// Given all of a unit's alarms (see byTu in loadFleet()), returns the one
// that should drive the tile's color: the highest-severity alarm that is
// NOT acknowledged. Returns null if there are no alarms, or every alarm on
// this unit has already been acknowledged (in which case the unit is
// healthy, per suppressIfAcknowledged's same rule applied alarm-by-alarm).
function pickWorstActiveAlarm(alarms) {
  let best = null;
  for (const a of alarms) {
    if (a.acknowledged) continue;
    if (!best || SEVERITY_PRIORITY[a.status] > SEVERITY_PRIORITY[best.status]) best = a;
  }
  return best;
}

/*
 * ── SHARED FILE-DOWNLOAD HELPER ──────────────────────────────────────────
 * Used by the various CSV exports below (List tab, daily reset). Plain
 * client-side Blob download — works even when this panel is opened
 * directly as a file:// page, no server involved.
 */
function downloadBlob(filename, mime, content) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function timestampForFilename() {
  return new Date().toISOString().replace(/[:.]/g, '-');
}

function csvEscape(val) {
  const s = String(val == null ? '' : val);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

/*
 * ── MANUAL OVERRIDES (local only, not Back4App) ─────────────────────────
 * Lets someone flag a unit as "review required" by hand — independent of
 * both the roster and any live Back4App data — with a short description.
 * Stored in this browser's localStorage only, keyed by TU, so it survives
 * reloads of this panel on THIS device but isn't written to Back4App and
 * isn't shared with anyone viewing the panel elsewhere.
 *
 * "Out of service" USED to be settable here too, but is now backed by the
 * TU_Status Back4App class instead (see "OUT OF SERVICE (TU_Status)" above
 * and setTuStatusStop()) — the "Set unit status" button writes there
 * directly once Back4App is configured, so it's visible on every device,
 * not just this browser. manualOverrides still accepts an out_of_service
 * entry as a LOCAL-ONLY fallback for trying the panel out without Back4App
 * configured at all — see applyManualOverride() below for exactly when
 * each source wins.
 */
const MANUAL_OVERRIDES_KEY = 'aor_fleet_manual_overrides_v1';

function loadManualOverrides() {
  try {
    const raw = localStorage.getItem(MANUAL_OVERRIDES_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (err) {
    console.warn('Could not read manual overrides from localStorage:', err);
    return {};
  }
}

function saveManualOverrides() {
  try {
    localStorage.setItem(MANUAL_OVERRIDES_KEY, JSON.stringify(manualOverrides));
  } catch (err) {
    console.warn('Could not save manual overrides to localStorage (they will not survive a reload):', err);
  }
}

let manualOverrides = loadManualOverrides();

function setManualOverride(tu, status, description) {
  manualOverrides[tu] = { status, description: (description || '').trim(), setAt: new Date().toISOString() };
  saveManualOverrides();
}

function clearManualOverride(tu) {
  delete manualOverrides[tu];
  saveManualOverrides();
}

/*
 * ── PRECEDENCE for a unit's displayed status ─────────────────────────────
 * Every unit passes through here on every render. In order:
 *
 * 1. A live TU_Status record with STOP=true (lastTuStatusByTu, populated by
 *    loadFleet() from the TU_Status class) — Out of Service, REASON as the
 *    description. Wins outright, over everything else, whenever Back4App
 *    is configured and has a record for this TU.
 * 2. Otherwise, a local review-required override (manualOverrides) — or,
 *    only when Back4App ISN'T configured at all, a local out_of_service
 *    override too (a fallback so the panel is still fully testable without
 *    a live TU_Status class to point at).
 * 3. Otherwise, `unit` unchanged — which by this point already reflects
 *    either a roster-level out_of_service pin (data/units.js) or whatever
 *    Live_Alarms says (see loadFleet()).
 */
function applyManualOverride(unit) {
  const tuStatus = lastTuStatusByTu[unit.tu];
  if (tuStatus && tuStatus.stop) {
    return {
      tu: unit.tu,
      status: 'out_of_service',
      raw_status: 'out_of_service',
      alert_code: tuStatus.reason || 'Out of service',
      alert_message: tuStatus.reason || '',
      alarm_key: unit.alarm_key,
      acknowledged: false,
      manual: false,
      tu_status: true,
      tu_status_reason: tuStatus.reason || '',
      tu_status_object_id: tuStatus.object_id,
      alarms: unit.alarms || [], // preserved so the tooltip/modal can still list what's underneath
      underlying: {
        status: unit.status,
        raw_status: unit.raw_status,
        alert_code: unit.alert_code,
        alert_message: unit.alert_message,
        acknowledged: unit.acknowledged
      }
    };
  }

  const ov = manualOverrides[unit.tu];
  const back4appConfigured = !!(BACK4APP_CONFIG.appId && BACK4APP_CONFIG.jsKey);
  if (!ov || (ov.status === 'out_of_service' && back4appConfigured)) return { ...unit, manual: false };
  return {
    tu: unit.tu,
    status: ov.status,
    raw_status: ov.status,
    alert_code: ov.description || (ov.status === 'out_of_service' ? 'Manually out of service' : 'Manually flagged for review'),
    alert_message: ov.description || '',
    alarm_key: unit.alarm_key,
    acknowledged: false,
    manual: true,
    manual_description: ov.description || '',
    manual_set_at: ov.setAt,
    alarms: unit.alarms || [], // preserved so the tooltip/modal can still list what's underneath a manual override
    underlying: {
      status: unit.status,
      raw_status: unit.raw_status,
      alert_code: unit.alert_code,
      alert_message: unit.alert_message,
      acknowledged: unit.acknowledged
    }
  };
}

/*
 * ── DAILY RESET (manual only — "Reset Alarms" header button) ─────────────
 * No automatic midnight timer and no catch-up-on-load: this only ever runs
 * when someone clicks "Reset Alarms" in the header, and only after they
 * confirm the warning dialog. On Accept, in order:
 *
 *   1. EVERY record currently in the Live_Alarms class — not just the ones
 *      currently rendered on a tile — is fetched straight from Back4App,
 *      PAGED through with `skip` (see RESET_ALARMS_PAGE_SIZE /
 *      fetchAllLiveAlarmsRaw() below) rather than a single capped query.
 *      Parse/Back4App hard-caps any one REST query at 1000 rows regardless
 *      of a higher `limit` — without paging, a class with more than 1000
 *      rows (easy to reach once Live_Alarms accumulates history instead of
 *      being purged) would silently leave everything past the first 1000
 *      behind, which is exactly why this used to take repeated clicks to
 *      actually empty the class. One click now walks every page.
 *   2. Every one of those raw records is written to one CSV
 *      (aor_fleet_daily_reset_<timestamp>.csv), one row per record, so
 *      there's a complete audit record of exactly what existed at the
 *      moment of the reset, before anything changes. This CSV is now the
 *      ONLY surviving record of a deleted alarm — see (3).
 *   3. Every one of those records — for EVERY unit, Out of Service units
 *      included, and regardless of whether its TU even matches a unit in
 *      the local roster or whether it's flagged "off" — is PERMANENTLY
 *      DELETED from Live_Alarms: a DELETE on that record's objectId, not a
 *      PUT, so the row is gone from Back4App entirely, not just marked
 *      acknowledged. This does NOT change a unit's Out of Service status
 *      itself — that lives on the separate TU_Status record (STOP/REASON),
 *      untouched here. A unit manually flagged "review required" (no
 *      Live_Alarms record behind it) has that override cleared too, for
 *      the same "back to healthy" effect.
 *
 * This is deliberately destructive: unlike the single-alarm "Acknowledge
 * fault" button (updateLiveAlarmAcknowledged(), still a non-destructive
 * PUT), there is no "undo" once a Reset Alarms delete succeeds — only the
 * CSV from step 2 still has the data. That's why the confirm dialog below
 * spells this out and why the JavaScript Key needs `delete` Class-Level
 * Permission on Live_Alarms (see README.md -> "Connecting to Back4App").
 *
 * Without Back4App configured (demo/local mode), there's no real
 * Live_Alarms class to page through at all — this falls back to the
 * roster-scoped behavior (runDailyReset()'s `else` branch below) so the
 * feature stays testable against the demo roster.
 *
 * See README.md -> "Daily reset".
 */
let dailyResetInFlight = false; // guards against a double-click re-entering mid-run

// Parse/Back4App REST hard-caps a single query's results at 1000 rows no
// matter what `limit` is requested — this is the page size used to walk
// the whole class via `skip` in fetchAllLiveAlarmsRaw() below.
const RESET_ALARMS_PAGE_SIZE = 1000;
// Last-resort guard against an unbounded loop (e.g. a server bug that
// never returns a short final page) — 200 pages is 200,000 rows, far
// beyond anything a 95-unit fleet should ever accumulate in Live_Alarms.
const RESET_ALARMS_MAX_PAGES = 200;

function downloadDailyResetAlarmsCsv(units) {
  const header = ['TU', 'Unit status', 'Severity', 'Alarm code', 'Alarm message', 'AteneaTimestamp', 'Acknowledged', 'Object ID'];
  const lines = [header.map(csvEscape).join(',')];
  units.forEach(u => {
    (u.alarms || []).forEach(a => {
      lines.push([
        u.tu,
        STATUS_LABEL[u.status] || u.status,
        STATUS_LABEL[a.status] || a.status,
        a.alert_code || '',
        a.alert_message || '',
        a.atenea_timestamp || '',
        a.acknowledged ? 'Yes' : 'No',
        a.object_id || ''
      ].map(csvEscape).join(','));
    });
  });
  downloadBlob(`aor_fleet_daily_reset_${timestampForFilename()}.csv`, 'text/csv', lines.join('\r\n'));
  return lines.length - 1; // row count, excluding the header
}

// Same CSV shape as downloadDailyResetAlarmsCsv() above, but built straight
// from RAW Live_Alarms records (fetchAllLiveAlarmsRaw()) instead of the
// roster-merged `units` — used when Back4App is configured, so the audit
// trail covers every record about to be deleted, not just the ones that
// happen to be currently rendered on a known unit. "Unit status" falls
// back to this record's own severity when its TU doesn't match a unit
// currently on screen (e.g. a stale/typo'd TU, or one added to Back4App
// but not yet to the roster).
function downloadDailyResetAlarmsCsvFromRaw(rawRecords) {
  const header = ['TU', 'Unit status', 'Severity', 'Alarm code', 'Alarm message', 'AteneaTimestamp', 'Acknowledged', 'Object ID'];
  const lines = [header.map(csvEscape).join(',')];
  rawRecords.forEach(rec => {
    const tu = pickField(rec, LIVE_ALARMS_FIELDS.tu) || '';
    const severityStatus = classifySeverity(pickField(rec, LIVE_ALARMS_FIELDS.severity));
    const knownUnit = tu && lastUnitsByTu[tu];
    lines.push([
      tu,
      knownUnit ? (STATUS_LABEL[knownUnit.status] || knownUnit.status) : 'Unknown (not on current roster)',
      STATUS_LABEL[severityStatus] || severityStatus,
      pickField(rec, LIVE_ALARMS_FIELDS.code) || '',
      pickField(rec, LIVE_ALARMS_FIELDS.message) || '',
      normalizeAteneaTimestamp(pickField(rec, LIVE_ALARMS_FIELDS.atenea_timestamp)) || '',
      isAcknowledgedTrue(rec) ? 'Yes' : 'No',
      rec.objectId || ''
    ].map(csvEscape).join(','));
  });
  downloadBlob(`aor_fleet_daily_reset_${timestampForFilename()}.csv`, 'text/csv', lines.join('\r\n'));
  return lines.length - 1; // row count, excluding the header
}

// Fetches EVERY record in Live_Alarms, paging with `skip` past Parse's
// 1000-row-per-query hard cap (see RESET_ALARMS_PAGE_SIZE above) — this is
// what lets Reset Alarms clear the whole class in one click regardless of
// how large it's grown, instead of only ever reaching the first 1000 rows.
// Returns null in demo/local mode (nothing configured to page through).
async function fetchAllLiveAlarmsRaw() {
  const { appId, jsKey } = BACK4APP_CONFIG;
  if (!appId || !jsKey) return null;
  const headers = { 'X-Parse-Application-Id': appId, 'X-Parse-JavaScript-Key': jsKey };
  const all = [];
  let skip = 0;
  let hitPageCap = false;
  for (let page = 0; page < RESET_ALARMS_MAX_PAGES; page++) {
    const res = await fetch(
      `https://parseapi.back4app.com/classes/Live_Alarms?limit=${RESET_ALARMS_PAGE_SIZE}&skip=${skip}&order=createdAt`,
      { headers }
    );
    if (!res.ok) {
      const bodyText = await res.text().catch(() => '');
      throw new Error(`Back4App HTTP ${res.status} (paged fetch, page ${page + 1})${bodyText ? ' — ' + bodyText : ''}`);
    }
    const body = await res.json();
    const results = body.results || [];
    all.push(...results);
    if (results.length < RESET_ALARMS_PAGE_SIZE) { hitPageCap = false; break; }
    skip += RESET_ALARMS_PAGE_SIZE;
    if (page === RESET_ALARMS_MAX_PAGES - 1) hitPageCap = true;
  }
  if (hitPageCap) {
    console.warn(
      `Daily reset: stopped paging Live_Alarms after ${all.length} record(s) — hit the safety cap of ` +
      `${RESET_ALARMS_MAX_PAGES} pages. There may be more left; running Reset Alarms again will pick up ` +
      `the rest.`
    );
  }
  return all;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

// A short pause between each Back4App write this button performs. Without
// it, dozens of DELETE requests fire back-to-back with no gap at all —
// easily enough to trip Back4App's per-second burst limit on a fleet with a
// lot of active alarms, which comes back as a transient error (e.g. HTTP
// 429) and, before this fix, could silently drop that one alarm's deletion
// (see deleteAlarmForDailyReset()'s retry below for the other half of the
// fix). 150ms keeps even a very bad day (dozens of alarms) comfortably
// under typical limits while still finishing in a few seconds, not minutes.
const DAILY_RESET_WRITE_DELAY_MS = 150;

// Demo/local-mode-only fallback path (Back4App not configured, so there's
// nothing real in Live_Alarms to page through — see fetchAllLiveAlarmsRaw()
// above and the `liveConfigured` branch in runDailyReset() below for the
// real path). Falls back to a session-only localAckOverrides entry — now
// "locally hidden" rather than "locally acknowledged", but reuses the same
// map since the visual effect (alarm disappears from this browser) is
// identical. Retries once after a short backoff on failure, same as the
// live path, for consistency even though a demo "delete" can't actually
// fail against a real server.
async function deleteAlarmForDailyReset(tu, alarm) {
  const attempt = async () => {
    const result = await deleteLiveAlarmRecord(alarm.object_id);
    if (!result.persisted) {
      const alarmKey = alarm.alarm_key || alarm.alert_code || alarm.status;
      localAckOverrides[tu + '|' + alarmKey] = true;
    }
  };
  try {
    await attempt();
  } catch (err) {
    console.warn(`Daily reset: first attempt to delete an alarm on ${tu} failed, retrying once:`, err);
    await sleep(500);
    await attempt(); // if this throws too, the caller's catch counts it as a real failure
  }
}

// The real (Back4App-configured) delete path — permanently removes ONE raw
// Live_Alarms record by objectId, used by runDailyReset()'s main sweep over
// fetchAllLiveAlarmsRaw()'s full paged result set. Retries once after a
// short backoff on failure — covers a transient error (e.g. a momentary
// 429/5xx from Back4App under the burst of deletes this button performs)
// instead of that one record silently surviving the reset.
async function deleteRawAlarmForDailyReset(objectId) {
  try {
    await deleteLiveAlarmRecord(objectId);
  } catch (err) {
    console.warn(`Daily reset: first attempt to delete Live_Alarms/${objectId} failed, retrying once:`, err);
    await sleep(500);
    await deleteLiveAlarmRecord(objectId); // if this throws too, the caller's catch counts it as a real failure
  }
}

async function runDailyReset() {
  if (dailyResetInFlight) return;

  const units = Object.values(lastUnitsByTu);
  if (!units.length) return; // nothing rendered yet to snapshot/reset against

  dailyResetInFlight = true;
  try {
    const { appId, jsKey } = BACK4APP_CONFIG;
    const liveConfigured = !!(appId && jsKey);

    // Clearing a manual "review required" override is always a local,
    // browser-only action (manualOverrides never touches Back4App), so it
    // runs the same way regardless of which branch below handles the real
    // Live_Alarms deletion. Deliberately not skipped for a unit that also
    // gets its underlying alarm(s) deleted below — those are two
    // independent things this button does for that unit (see the doc
    // comment above runDailyReset for why).
    let clearedManualCount = 0;
    for (const u of units) {
      if (u.manual && u.status === 'review') {
        clearManualOverride(u.tu);
        clearedManualCount++;
      }
    }

    let rowCount = 0;
    let deletedCount = 0;
    let totalCount = 0;
    const failedAlarms = []; // { tu, alert_code, error } — surfaced to the user below, not just the console

    if (liveConfigured) {
      // The real path: fetch the ENTIRE Live_Alarms class (paged past
      // Parse's 1000-row cap — see fetchAllLiveAlarmsRaw()) and delete
      // every record it returns, with no filtering by roster membership,
      // unit status, or "flag" — this is what makes one click enough
      // regardless of how large the class has grown.
      let rawRecords;
      try {
        rawRecords = await fetchAllLiveAlarmsRaw();
      } catch (err) {
        alert(
          'Daily reset could not read Live_Alarms from Back4App, so nothing was downloaded or deleted:\n\n' +
          (err && err.message ? err.message : String(err))
        );
        return; // nothing fetched — nothing to snapshot or delete this run
      }

      rowCount = downloadDailyResetAlarmsCsvFromRaw(rawRecords);
      totalCount = rawRecords.length;

      for (const rec of rawRecords) {
        const tu = pickField(rec, LIVE_ALARMS_FIELDS.tu) || '(no TU field)';
        try {
          await deleteRawAlarmForDailyReset(rec.objectId);
          deletedCount++;
        } catch (err) {
          console.warn(`Daily reset: failed to delete Live_Alarms/${rec.objectId} (${tu}):`, err);
          failedAlarms.push({ tu, alert_code: pickField(rec, LIVE_ALARMS_FIELDS.code) || '', error: err && err.message ? err.message : String(err) });
        }
        await sleep(DAILY_RESET_WRITE_DELAY_MS); // pace writes — see DAILY_RESET_WRITE_DELAY_MS above
      }
    } else {
      // Demo/local-only mode — no live Live_Alarms to page through, so
      // fall back to the roster-scoped CSV + local-hide behavior so the
      // feature is still fully testable without Back4App configured.
      rowCount = downloadDailyResetAlarmsCsv(units);

      for (const u of units) {
        for (const alarm of (u.alarms || [])) {
          totalCount++;
          try {
            await deleteAlarmForDailyReset(u.tu, alarm);
            deletedCount++;
          } catch (err) {
            console.warn(`Daily reset: failed to delete an alarm on ${u.tu}:`, err);
            failedAlarms.push({ tu: u.tu, alert_code: alarm.alert_code || '', error: err && err.message ? err.message : String(err) });
          }
          await sleep(DAILY_RESET_WRITE_DELAY_MS); // pace writes — see DAILY_RESET_WRITE_DELAY_MS above
        }
      }
    }

    console.log(
      `Daily reset: ${rowCount} record(s) written to the CSV snapshot, ${deletedCount} of ${totalCount} ` +
      `record(s) permanently deleted from Live_Alarms, ${clearedManualCount} manual "review required" ` +
      `override(s) cleared, ${failedAlarms.length} record(s) failed to delete even after a retry.`
    );

    if (failedAlarms.length) {
      const preview = failedAlarms.slice(0, 5).map(f => `${f.tu}${f.alert_code ? ` (${f.alert_code})` : ''}`).join(', ');
      const more = failedAlarms.length > 5 ? `, and ${failedAlarms.length - 5} more` : '';
      alert(
        `Reset Alarms finished, but ${failedAlarms.length} record(s) could not be deleted from Back4App ` +
        `after retrying: ${preview}${more}.\n\n` +
        `The CSV downloaded still captured everything as it was before the reset, and those record(s) are ` +
        `still live in Live_Alarms — nothing was lost. This is usually a temporary issue (e.g. Back4App ` +
        `briefly rate-limiting the burst of deletes, or the JavaScript Key missing "delete" permission on ` +
        `Live_Alarms) — check the browser console (F12) for the specific error on each one, and running ` +
        `Reset Alarms again is safe: it will simply try to delete those same records again.`
      );
    }

    await loadFleet();
  } finally {
    dailyResetInFlight = false;
  }
}

function initDailyResetButton() {
  document.getElementById('dailyResetBtn').addEventListener('click', () => {
    const ok = confirm(
      'Run the daily reset now?\n\n' +
      'This will download a CSV of every record currently in Live_Alarms (acknowledged and not), then ' +
      'PERMANENTLY DELETE every one of them from Back4App — the entire class, with no exceptions, in one ' +
      'run (paged past Back4App\'s 1000-row-per-query limit, so this empties it even if it has grown ' +
      'larger than that). Out of Service units are included too — their Out of Service status itself is ' +
      'not affected, only their alarm history.\n\n' +
      'This is not reversible: once deleted, the only remaining copy of that data is the CSV that just ' +
      'downloaded. Continue?'
    );
    if (!ok) return;
    runDailyReset().catch(err => {
      console.error('Daily reset failed:', err);
      alert('Daily reset failed: ' + (err && err.message ? err.message : err));
    });
  });
}

function pickField(record, candidates) {
  for (const key of candidates) {
    const v = record[key];
    if (v !== undefined && v !== null && v !== '') return v;
  }
  return undefined;
}

function classifySeverity(sevRaw) {
  const s = String(sevRaw == null ? '' : sevRaw).trim().toUpperCase();
  if (s === 'L1') return 'failure';
  if (s === 'MA') return 'maintenance';
  return 'review'; // L2, L3, anything else unrecognized, or no readable severity at all
}

// Treats a flag value of "off" (any case), false, or 0 as suppressed.
// A record with no flag field at all is NOT suppressed — only an explicit
// "off" hides an alarm, so a schema without this field just shows everyone.
function isFlagOff(rec) {
  const v = pickField(rec, LIVE_ALARMS_FIELDS.flag);
  if (v === undefined) return false;
  if (v === false || v === 0) return true;
  return String(v).trim().toLowerCase() === 'off';
}

// Tolerant boolean read for the `acknowledged` field on a Live_Alarms
// record — true / "true" / 1 all count, everything else is false.
function isAcknowledgedTrue(rec) {
  const v = pickField(rec, LIVE_ALARMS_FIELDS.acknowledged);
  if (v === undefined) return false;
  if (v === true || v === 1) return true;
  return String(v).trim().toLowerCase() === 'true';
}

// Tolerant boolean read for the `STOP` field on a TU_Status record —
// true / "true" / 1 all count, everything else (including missing) is
// false, i.e. not out of service.
function isStopTrue(rec) {
  const v = pickField(rec, TU_STATUS_FIELDS.stop);
  if (v === undefined) return false;
  if (v === true || v === 1) return true;
  return String(v).trim().toLowerCase() === 'true';
}

// A raw Parse REST fetch returns a Date field as { __type: "Date", iso:
// "..." } rather than a plain string — this reads AteneaTimestamp either
// way and normalizes it down to a plain ISO string for storage (in the
// unit/alarm objects, the ack log, and CSV rows). '' when absent/unreadable.
function normalizeAteneaTimestamp(v) {
  if (!v) return '';
  if (typeof v === 'string') return v;
  if (typeof v === 'object' && typeof v.iso === 'string') return v.iso;
  return '';
}

// Display formatting for the ISO string normalizeAteneaTimestamp() produces
// — used anywhere AteneaTimestamp is shown on screen (not in CSVs, which
// keep the plain ISO string so it stays a clean sortable value in a
// spreadsheet). '—' when there's nothing to show or it doesn't parse.
function formatAteneaTimestamp(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return isNaN(d.getTime()) ? String(iso) : d.toLocaleString();
}

async function fetchLiveAlarms() {
  const { appId, jsKey } = BACK4APP_CONFIG;
  if (!appId || !jsKey) return null; // not configured — fully disabled
  const res = await fetch('https://parseapi.back4app.com/classes/Live_Alarms?limit=1000', {
    headers: { 'X-Parse-Application-Id': appId, 'X-Parse-JavaScript-Key': jsKey }
  });
  if (!res.ok) throw new Error('Back4App HTTP ' + res.status);
  const body = await res.json();
  return body.results || [];
}

async function fetchTuStatus() {
  const { appId, jsKey } = BACK4APP_CONFIG;
  if (!appId || !jsKey) return null; // not configured — fully disabled
  const res = await fetch('https://parseapi.back4app.com/classes/TU_Status?limit=1000', {
    headers: { 'X-Parse-Application-Id': appId, 'X-Parse-JavaScript-Key': jsKey }
  });
  if (!res.ok) throw new Error('Back4App HTTP ' + res.status);
  const body = await res.json();
  return body.results || [];
}

/*
 * ── ACKNOWLEDGING FAULTS ─────────────────────────────────────────────────
 * Acknowledgment is written straight onto the SAME Live_Alarms record the
 * alarm itself came from — a plain PUT setting its `acknowledged` field —
 * rather than into a separate class. Live_Alarms is not replaced/recreated
 * out from under it, so that field sticks on that record until something
 * explicitly changes it again.
 */
async function updateLiveAlarmAcknowledged(objectId, acknowledged) {
  const { appId, jsKey } = BACK4APP_CONFIG;
  if (!appId || !jsKey || !objectId) return { persisted: false }; // demo/local-only mode, or no live record to write to

  const headers = {
    'X-Parse-Application-Id': appId,
    'X-Parse-JavaScript-Key': jsKey,
    'Content-Type': 'application/json'
  };
  const res = await fetch(`https://parseapi.back4app.com/classes/Live_Alarms/${objectId}`, {
    method: 'PUT',
    headers,
    body: JSON.stringify({ acknowledged })
  });
  if (!res.ok) {
    const bodyText = await res.text().catch(() => '');
    throw new Error(`Back4App HTTP ${res.status} (update)${bodyText ? ' — ' + bodyText : ''}`);
  }
  return { persisted: true };
}

/*
 * ── DELETING A LIVE_ALARMS RECORD (Reset Alarms only) ────────────────────
 * Used only by the "Reset Alarms" header button's daily-reset flow
 * (deleteAlarmForDailyReset() above) — a permanent DELETE that removes the
 * record from Back4App entirely, unlike updateLiveAlarmAcknowledged()'s
 * non-destructive PUT used by the single-alarm Acknowledge/Un-acknowledge
 * button. Mirrors updateLiveAlarmAcknowledged()'s config/objectId gating
 * and error-throwing shape; a DELETE needs no request body.
 */
async function deleteLiveAlarmRecord(objectId) {
  const { appId, jsKey } = BACK4APP_CONFIG;
  if (!appId || !jsKey || !objectId) return { persisted: false }; // demo/local-only mode, or no live record to delete

  const headers = {
    'X-Parse-Application-Id': appId,
    'X-Parse-JavaScript-Key': jsKey
  };
  const res = await fetch(`https://parseapi.back4app.com/classes/Live_Alarms/${objectId}`, {
    method: 'DELETE',
    headers
  });
  if (!res.ok) {
    const bodyText = await res.text().catch(() => '');
    throw new Error(`Back4App HTTP ${res.status} (delete)${bodyText ? ' — ' + bodyText : ''}`);
  }
  return { persisted: true };
}

/*
 * ── SETTING / CLEARING OUT OF SERVICE (TU_Status) ────────────────────────
 * Upsert, since unlike an alarm (which always has a pre-existing Live_Alarms
 * record to act on) a unit going out of service for the first time may have
 * no TU_Status row yet: PUT to the existing record when `existingObjectId`
 * is given (from lastTuStatusByTu[tu].object_id), otherwise POST to create
 * one. Clearing calls this the same way with stop=false — it flips STOP
 * back off on the existing record rather than deleting it, the same way
 * un-acknowledging flips `acknowledged` back off on a Live_Alarms record —
 * so REASON stays as history instead of being thrown away.
 */
async function setTuStatusStop(tu, stop, reason, existingObjectId) {
  const { appId, jsKey } = BACK4APP_CONFIG;
  if (!appId || !jsKey) return { persisted: false }; // demo/local-only mode

  const headers = {
    'X-Parse-Application-Id': appId,
    'X-Parse-JavaScript-Key': jsKey,
    'Content-Type': 'application/json'
  };
  const payload = { STOP: stop, REASON: reason || '' };

  let res;
  if (existingObjectId) {
    res = await fetch(`https://parseapi.back4app.com/classes/TU_Status/${existingObjectId}`, {
      method: 'PUT',
      headers,
      body: JSON.stringify(payload)
    });
  } else {
    res = await fetch('https://parseapi.back4app.com/classes/TU_Status', {
      method: 'POST',
      headers,
      body: JSON.stringify({ TU: tu, ...payload })
    });
  }
  if (!res.ok) {
    const bodyText = await res.text().catch(() => '');
    throw new Error(`Back4App HTTP ${res.status} (${existingObjectId ? 'update' : 'create'})${bodyText ? ' — ' + bodyText : ''}`);
  }
  const body = await res.json().catch(() => ({}));
  return { persisted: true, object_id: existingObjectId || body.objectId };
}

async function loadFleet() {
  hideLiveWarning();

  let roster;
  if (window.__FLEET_DATA__) {
    roster = window.__FLEET_DATA__;
  } else {
    try {
      const res = await fetch(DATA_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      roster = await res.json();
      hideLoadError();
    } catch (err) {
      showLoadError(err);
      return;
    }
  }

  let liveRecords = null;
  try {
    liveRecords = await fetchLiveAlarms();
  } catch (err) {
    console.warn('Back4App fetch failed, falling back to roster data:', err);
  }

  // TU_Status (Out of Service) is fetched independently of Live_Alarms and
  // applied the same way regardless of which branch below ends up running
  // — lastTuStatusByTu is read by applyManualOverride() for every unit, in
  // both the full-live path and the applyLocalAckToRoster() fallback paths.
  let tuStatusRecords = null;
  try {
    tuStatusRecords = await fetchTuStatus();
  } catch (err) {
    console.warn('Back4App TU_Status fetch failed, Out of Service status may be stale:', err);
  }
  const tuStatusByTu = {};
  let tuStatusUnmatched = 0;
  (tuStatusRecords || []).forEach(rec => {
    const tu = pickField(rec, TU_STATUS_FIELDS.tu);
    if (!tu) { tuStatusUnmatched++; return; }
    tuStatusByTu[tu] = {
      stop: isStopTrue(rec),
      reason: pickField(rec, TU_STATUS_FIELDS.reason) || '',
      object_id: rec.objectId
    };
  });
  if (tuStatusUnmatched) {
    console.warn(`${tuStatusUnmatched} of ${(tuStatusRecords || []).length} fetched TU_Status record(s) had no readable "TU" field (tried: ${TU_STATUS_FIELDS.tu.join(', ')}) and were skipped.`);
  }
  lastTuStatusByTu = tuStatusByTu;

  if (!liveRecords) {
    render(applyLocalAckToRoster(roster));
    return;
  }

  // byTu now collects an ARRAY of alarms per TU (a unit can have more than
  // one active Live_Alarms record at once) rather than overwriting down to
  // a single "worst" one — see "MULTIPLE ALARMS PER UNIT" above.
  const byTu = {};
  let unmatched = 0;
  let flaggedOffCount = 0;
  liveRecords.forEach(rec => {
    const tu = pickField(rec, LIVE_ALARMS_FIELDS.tu);
    if (!tu) { unmatched++; return; }
    if (isFlagOff(rec)) { flaggedOffCount++; return; } // suppressed — treat as if this alarm doesn't exist
    const status = classifySeverity(pickField(rec, LIVE_ALARMS_FIELDS.severity));
    const entry = {
      status,
      alert_code: pickField(rec, LIVE_ALARMS_FIELDS.code) || pickField(rec, LIVE_ALARMS_FIELDS.severity) || 'Active alarm',
      alert_message: pickField(rec, LIVE_ALARMS_FIELDS.message) || '',
      alarm_key: pickField(rec, ['alarmId']) || pickField(rec, LIVE_ALARMS_FIELDS.severity) || 'alarm',
      object_id: rec.objectId,
      acknowledged: isAcknowledgedTrue(rec),
      atenea_timestamp: normalizeAteneaTimestamp(pickField(rec, LIVE_ALARMS_FIELDS.atenea_timestamp))
    };
    if (!byTu[tu]) byTu[tu] = [];
    byTu[tu].push(entry);
  });

  if (liveRecords.length && unmatched === liveRecords.length) {
    console.warn('None of the fetched Live_Alarms records matched LIVE_ALARMS_FIELDS.tu. Sample record:', liveRecords[0]);
    showLiveWarning(
      'Connected to Back4App, but couldn’t find the train-unit field on any fetched Live_Alarms record ' +
      '(tried: <code>' + LIVE_ALARMS_FIELDS.tu.join('</code>, <code>') + '</code>). ' +
      'Showing roster data instead — check LIVE_ALARMS_FIELDS in index.html against your Live_Alarms schema ' +
      '(a sample record was logged to the browser console).'
    );
    render(applyLocalAckToRoster(roster));
    return;
  }

  /*
   * ── DIAGNOSTICS FOR "SOME OF MY DATA ISN'T SHOWING" ──────────────────
   * These three situations all silently drop a Live_Alarms record without
   * an error — by design (an unmatched TU shouldn't take down the whole
   * panel the way the "unmatched === everything" case above does), but
   * silent is exactly what makes "I have data in the database that isn't
   * displaying" hard to self-diagnose. Surfaced here instead: a console
   * warning always, and a banner for the most common real cause (a TU
   * Back4App knows about that isn't in the local roster).
   */
  if (unmatched > 0 && unmatched < liveRecords.length) {
    console.warn(`${unmatched} of ${liveRecords.length} fetched Live_Alarms record(s) had no readable "tu" field (tried: ${LIVE_ALARMS_FIELDS.tu.join(', ')}) and were skipped.`);
  }
  if (flaggedOffCount) {
    console.log(`${flaggedOffCount} Live_Alarms record(s) suppressed this refresh because their "flag" field is off.`);
  }
  const rosterTus = new Set((roster.units || []).map(u => u.tu));
  const unknownTus = Object.keys(byTu).filter(tu => !rosterTus.has(tu));
  if (unknownTus.length) {
    console.warn(
      `${unknownTus.length} Live_Alarms record(s) matched a TU that isn't in the current roster (data/units.js) ` +
      `and are NOT shown on any tile: ${unknownTus.join(', ')}. Check for a typo/casing/whitespace difference ` +
      `between Back4App's "tu" field and data/units.js, or add the unit to data/units.js if it's genuinely new.`
    );
    showLiveWarning(
      `Connected to Back4App — ${unknownTus.length} alarm(s) reference a unit not in the current roster and ` +
      `aren't shown on any tile: <code>${unknownTus.map(escapeHtml).join('</code>, <code>')}</code>. Check for a ` +
      `typo/casing mismatch against <code>data/units.js</code>, or add the unit there if it's genuinely new ` +
      `(same list logged to the browser console).`
    );
  }

  // A fourth silent-drop case, distinct from the three above: a live
  // record that DID match a roster TU and DID have a real fault, but is
  // rendering Healthy anyway because every one of that unit's alarms
  // already has acknowledged=true (see "ACKNOWLEDGING FAULTS" below —
  // that flag now lives directly on each record). This is everyday/
  // expected behavior (that's what acknowledging is for), so it doesn't
  // get a banner, but it's exactly what "flag is on but it's not showing"
  // usually turns out to be, so it's worth a console line to make that
  // checkable in seconds.
  const suppressedByAck = [];

  const mergedUnits = (roster.units || []).map(u => {
    let unit;
    if (u.status === 'out_of_service') {
      unit = { tu: u.tu, status: 'out_of_service', raw_status: 'out_of_service', acknowledged: false, alarms: [] };
    } else {
      const alarms = byTu[u.tu] || [];
      if (!alarms.length) {
        unit = { tu: u.tu, status: 'healthy', raw_status: 'healthy', acknowledged: false, alarms: [] };
      } else {
        const worst = pickWorstActiveAlarm(alarms);
        if (worst) {
          unit = {
            tu: u.tu,
            status: worst.status,
            raw_status: worst.status,
            alert_code: worst.alert_code,
            alert_message: worst.alert_message,
            alarm_key: worst.alarm_key,
            object_id: worst.object_id,
            acknowledged: false,
            atenea_timestamp: worst.atenea_timestamp,
            alarms
          };
        } else {
          // every alarm on this unit is acknowledged — healthy, but keep the
          // "representative" alarm's own detail around for the modal/tooltip
          suppressedByAck.push(u.tu);
          const rep = alarms[0];
          unit = {
            tu: u.tu,
            status: 'healthy',
            raw_status: rep.status,
            alert_code: rep.alert_code,
            alert_message: rep.alert_message,
            alarm_key: rep.alarm_key,
            object_id: rep.object_id,
            acknowledged: true,
            atenea_timestamp: rep.atenea_timestamp,
            alarms
          };
        }
      }
    }
    return applyManualOverride(unit);
  });

  if (suppressedByAck.length) {
    console.log(
      `${suppressedByAck.length} unit(s) have active Live_Alarms fault(s) but show Healthy because every ` +
      `one of their alarms has acknowledged=true: ${suppressedByAck.join(', ')}. Click the tile (look for a ` +
      `small ✓ badge on it) to see the real status, or Un-acknowledge there to show it as red/amber/blue again.`
    );
  }

  render({ units: mergedUnits, _meta: { generated: new Date().toISOString() } });

  if (!liveRefreshTimer) liveRefreshTimer = setInterval(loadFleet, LIVE_REFRESH_MS);
}

function applyLocalAckToRoster(roster) {
  const units = (roster.units || []).map(u => {
    const alarmKey = u.alert_code || u.status;
    const acknowledged = !!localAckOverrides[u.tu + '|' + alarmKey];
    const hasFault = u.status === 'failure' || u.status === 'review' || u.status === 'maintenance';
    // Demo/no-Back4App roster entries only ever carry one status each (no
    // severity concept locally) — still wrapped as a 1-item alarms array so
    // the tooltip/modal/daily-reset CSV code has one shape to work with
    // regardless of where the data came from.
    const alarms = hasFault ? [{
      status: u.status,
      alert_code: u.alert_code || '',
      alert_message: u.alert_message || '',
      alarm_key: alarmKey,
      object_id: null,
      acknowledged
    }] : [];
    const unit = {
      ...u,
      raw_status: u.status,
      status: suppressIfAcknowledged(u.status, acknowledged),
      alarm_key: alarmKey,
      acknowledged,
      alarms
    };
    return applyManualOverride(unit);
  });
  return { units, _meta: roster._meta };
}

function render(json) {
  const units = json.units || [];
  const isDemo = !!(json._meta && json._meta.source);

  lastUnitsByTu = {};
  units.forEach(u => { lastUnitsByTu[u.tu] = u; });

  document.getElementById('demoFlagInline').innerHTML = isDemo
    ? '<span class="demo-flag">Demo data</span>'
    : '';

  const counts = { healthy: 0, review: 0, failure: 0, maintenance: 0, out_of_service: 0 };
  units.forEach(u => { if (counts[u.status] !== undefined) counts[u.status]++; });

  const badgeMeta = [
    ['failure', 'In failure'],
    ['review', 'Review required'],
    ['maintenance', 'Maintenance Alert'],
    ['out_of_service', 'Out of service'],
    ['healthy', 'Healthy']
  ];
  document.getElementById('badges').innerHTML = badgeMeta.map(([key, label]) =>
    `<div class="badge"><span class="dot ${STATUS_DOT_CLASS[key]}"></span>${label} <span class="count">${counts[key]}</span></div>`
  ).join('');

  document.getElementById('kpiBottom').innerHTML = badgeMeta.map(([key, label]) => `
    <div class="kpi-card ${key}">
      <div class="kpi-label"><span class="dot ${STATUS_DOT_CLASS[key]}"></span>${label}</div>
      <div class="kpi-value">${counts[key]}</div>
    </div>`
  ).join('');

  const grid = document.getElementById('grid');
  grid.innerHTML = units.map(u => {
    const label = STATUS_LABEL[u.status] || u.status;
    const ackSuffix = u.acknowledged ? ' (acknowledged)' : '';
    const manualSuffix = u.manual ? ' (manually set)' : '';
    // Every alarm this unit has (not just the "worst" one driving the tile
    // color) is embedded here as JSON, so the hover tooltip can list all of
    // them — see attachTooltips() below. HTML-escaped like the other data-*
    // attributes so it round-trips safely through the attribute value.
    const alarmsJson = escapeAttr(JSON.stringify((u.alarms || []).map(a => ({
      status: a.status, code: a.alert_code || '', msg: a.alert_message || '', ack: !!a.acknowledged
    }))));
    return `<div class="tile ${escapeAttr(u.status)}" role="listitem" tabindex="0"
      data-tu="${escapeAttr(u.tu)}" data-status="${escapeAttr(u.status)}"
      data-code="${escapeAttr(u.alert_code || '')}" data-msg="${escapeAttr(u.alert_message || '')}"
      data-ack="${u.acknowledged ? '1' : '0'}" data-manual="${u.manual ? '1' : '0'}"
      data-alarms="${alarmsJson}"
      aria-label="${escapeAttr(u.tu)} — ${escapeAttr(label)}${ackSuffix}${manualSuffix}${u.alert_message ? ': ' + escapeAttr(u.alert_message) : ''}. Press Enter for details.">
      ${escapeHtml(u.tu)}${u.acknowledged ? '<span class="ack-badge" title="Acknowledged">✓</span>' : ''}${u.manual ? '<span class="manual-badge" title="Manually set">⚑</span>' : ''}
    </div>`;
  }).join('');

  if (!grid.dataset.interactionsAttached) {
    attachTooltips(grid);
    attachGridInteractions(grid);
    grid.dataset.interactionsAttached = '1';
  }

  const unitList = document.getElementById('unitList');
  if (unitList) unitList.innerHTML = units.map(u => `<option value="${escapeAttr(u.tu)}"></option>`).join('');

  const alerts = units.filter(u => u.status === 'failure' || u.status === 'review' || u.status === 'maintenance');
  document.getElementById('alertCount').textContent = alerts.length;
  document.getElementById('unitCount').textContent = units.length;

  const ticker = document.getElementById('ticker');
  if (!alerts.length) {
    ticker.innerHTML = '<span class="empty">No active alerts.</span>';
  } else {
    ticker.innerHTML = alerts.map((u, i) => {
      const sep = i < alerts.length - 1 ? '<span class="sep">·</span>' : '';
      return `<span class="alert-item ${escapeAttr(u.status)}"><span class="tu">${escapeHtml(u.tu)}</span> — ${escapeHtml(u.alert_code || '')}</span>${sep}`;
    }).join('');
  }

  const footer = document.getElementById('footer');
  footer.textContent = isDemo ? '' : `Fleet data as of ${new Date().toLocaleString()}.`;

  // Kept in sync with the tile grid on every render, regardless of which
  // tab is currently visible — see "TABS (Tiles / List)" below.
  renderAlarmList(units);
}

/*
 * ── TABS (Tiles / List) ───────────────────────────────────────────────────
 * "Tiles" is the original annunciator grid (unchanged). "List" is a flat
 * table of every alarm on every unit — acknowledged AND not acknowledged —
 * one row per alarm (a unit with two active alarms gets two rows), so it's
 * the one place to see everything at once rather than hovering tile by
 * tile. Both tabs render from the same lastUnitsByTu on every poll, so
 * switching tabs never shows stale data. Clicking a row opens that unit's
 * usual detail modal (openUnitModal) — the same acknowledge/un-acknowledge
 * actions available from a tile are available from a list row.
 */
let activeTab = (() => {
  try { return localStorage.getItem('aor_fleet_active_tab_v1') || 'tiles'; } catch (err) { return 'tiles'; }
})();
let alarmListFilter = 'all'; // 'all' | 'ack' | 'unack'

function initTabs() {
  const tabs = [
    { key: 'tiles', btn: 'tabBtnTiles', panel: 'tabPanelTiles' },
    { key: 'list', btn: 'tabBtnList', panel: 'tabPanelList' }
  ];
  function apply() {
    tabs.forEach(t => {
      const isActive = t.key === activeTab;
      document.getElementById(t.btn).setAttribute('aria-selected', isActive ? 'true' : 'false');
      document.getElementById(t.panel).hidden = !isActive;
    });
  }
  tabs.forEach(t => {
    document.getElementById(t.btn).addEventListener('click', () => {
      activeTab = t.key;
      try { localStorage.setItem('aor_fleet_active_tab_v1', activeTab); } catch (err) { /* ignore */ }
      apply();
    });
  });
  apply();
}

function renderAlarmList(units) {
  const wrap = document.getElementById('alarmListWrap');
  if (!wrap) return;

  const rows = [];
  units.forEach(u => {
    (u.alarms || []).forEach(a => {
      rows.push({ tu: u.tu, unitStatus: u.status, ...a });
    });
  });

  const ackCount = rows.filter(r => r.acknowledged).length;
  const unackCount = rows.length - ackCount;
  const filtered = rows.filter(r =>
    alarmListFilter === 'all' ? true : alarmListFilter === 'ack' ? r.acknowledged : !r.acknowledged
  );
  // Worst/most-urgent-first, then newest-looking (unacknowledged) before
  // acknowledged within the same severity, then alphabetical by TU.
  filtered.sort((a, b) =>
    (SEVERITY_PRIORITY[b.status] || 0) - (SEVERITY_PRIORITY[a.status] || 0) ||
    Number(a.acknowledged) - Number(b.acknowledged) ||
    a.tu.localeCompare(b.tu)
  );

  const filterBtn = (key, label) =>
    `<button data-filter="${key}" aria-pressed="${alarmListFilter === key ? 'true' : 'false'}">${label}</button>`;

  let html = `<div class="alarm-table-head">
    <div class="alarm-table-summary">
      <strong>${rows.length}</strong> alarm${rows.length === 1 ? '' : 's'} total ·
      <strong>${unackCount}</strong> not acknowledged · <strong>${ackCount}</strong> acknowledged
    </div>
    <div class="alarm-table-actions">
      <div class="alarm-filter">
        ${filterBtn('all', 'All')}
        ${filterBtn('unack', 'Not acknowledged')}
        ${filterBtn('ack', 'Acknowledged')}
      </div>
      <button class="btn-manual" id="alarmListExportBtn" type="button" ${filtered.length ? '' : 'disabled'}
        title="Downloads the ${filtered.length} row(s) currently shown below (respects the active filter)">💾 Export CSV</button>
    </div>
  </div>`;

  if (!filtered.length) {
    html += `<div class="alarm-table-scroll"><div class="alarm-table-empty">${
      rows.length ? 'No alarms match this filter.' : 'No alarms currently held for any unit.'
    }</div></div>`;
  } else {
    html += `<div class="alarm-table-scroll"><table class="alarm-table">
      <thead><tr>
        <th>TU</th><th>Severity</th><th>Alarm code</th><th>Message</th><th>Timestamp</th><th>Acknowledged</th>
      </tr></thead>
      <tbody>${filtered.map(r => `
        <tr data-tu="${escapeAttr(r.tu)}" tabindex="0" role="button" aria-label="Open ${escapeAttr(r.tu)} details">
          <td class="al-tu">${escapeHtml(r.tu)}</td>
          <td><span class="al-sev"><span class="dot ${STATUS_DOT_CLASS[r.status] || ''}"></span>${escapeHtml(STATUS_LABEL[r.status] || r.status)}</span></td>
          <td>${escapeHtml(r.alert_code || '')}</td>
          <td class="al-msg">${escapeHtml(r.alert_message || '')}</td>
          <td class="al-ts" style="white-space:nowrap;color:var(--ink-dim)">${escapeHtml(formatAteneaTimestamp(r.atenea_timestamp))}</td>
          <td><span class="al-ack ${r.acknowledged ? 'yes' : 'no'}">${r.acknowledged ? 'Yes' : 'No'}</span></td>
        </tr>`).join('')}
      </tbody>
    </table></div>`;
  }

  wrap.innerHTML = html;

  wrap.querySelectorAll('[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      alarmListFilter = btn.dataset.filter;
      renderAlarmList(Object.values(lastUnitsByTu));
    });
  });
  wrap.querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', () => openUnitModal(tr.dataset.tu));
    tr.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openUnitModal(tr.dataset.tu); }
    });
  });

  const exportBtn = document.getElementById('alarmListExportBtn');
  if (exportBtn) exportBtn.addEventListener('click', () => downloadAlarmListCsv(filtered));
}

// Exports whatever's currently on screen in the List tab (respects the
// active All/Not acknowledged/Acknowledged filter and the same
// worst-first sort order the table itself uses) — same CSV shape as the
// daily reset's audit CSV (see "DAILY RESET" above) so the two are
// consistent, just scoped to what's currently filtered/visible here.
function downloadAlarmListCsv(rows) {
  const snapshotAt = new Date().toISOString();
  const header = ['TU', 'Unit status', 'Severity', 'Alarm code', 'Alarm message', 'AteneaTimestamp', 'Acknowledged', 'Object ID', 'Exported at'];
  const lines = [header.map(csvEscape).join(',')];
  rows.forEach(r => {
    lines.push([
      r.tu,
      STATUS_LABEL[r.unitStatus] || r.unitStatus,
      STATUS_LABEL[r.status] || r.status,
      r.alert_code || '',
      r.alert_message || '',
      r.atenea_timestamp || '',
      r.acknowledged ? 'Yes' : 'No',
      r.object_id || '',
      snapshotAt
    ].map(csvEscape).join(','));
  });
  const suffix = alarmListFilter === 'all' ? 'all' : alarmListFilter === 'ack' ? 'acknowledged' : 'not-acknowledged';
  downloadBlob(`aor_fleet_alarm_list_${suffix}_${timestampForFilename()}.csv`, 'text/csv', lines.join('\r\n'));
}

function attachTooltips(grid) {
  const tt = document.getElementById('tooltip');
  let current = null;

  function showFor(tile, x, y) {
    const tu = tile.dataset.tu;
    const status = tile.dataset.status;
    const code = tile.dataset.code;
    const msg = tile.dataset.msg;
    const acked = tile.dataset.ack === '1';
    const manual = tile.dataset.manual === '1';
    const statusLabel = (STATUS_LABEL[status] || status) + (acked ? ' (acknowledged)' : '') + (manual ? ' (manually set)' : '');

    let alarms = [];
    try { alarms = JSON.parse(tile.dataset.alarms || '[]'); } catch (err) { alarms = []; }

    let detailHtml;
    if (alarms.length > 1) {
      // Several alarms on this one unit — list every one of them (not just
      // the worst, which is all the tile's own color can show) so hovering
      // is how you find out a unit has more than a single active alarm.
      detailHtml = `<ul class="tt-alarm-list">` + alarms.map(a => `
        <li class="tt-alarm-item">
          <span class="tt-alarm-sev ${escapeAttr(a.status)}">${escapeHtml(STATUS_LABEL[a.status] || a.status)}</span>
          ${a.ack ? '<span class="tt-alarm-ack"> · acknowledged</span>' : ''}<br>
          <strong>${escapeHtml(a.code || '')}</strong>${a.msg ? '<br>' + escapeHtml(a.msg) : ''}
        </li>`).join('') + `</ul>`;
    } else if (code) {
      detailHtml = `<div class="tt-msg"><strong>${escapeHtml(code)}</strong><br>${escapeHtml(msg || '')}</div>`;
    } else {
      detailHtml = '';
    }

    tt.innerHTML =
      `<div class="tt-tu">${escapeHtml(tu)}${alarms.length > 1 ? ` (${alarms.length} alarms)` : ''}</div>` +
      `<div class="tt-status ${escapeAttr(status)}">${escapeHtml(statusLabel)}</div>` +
      detailHtml +
      `<div class="tt-msg" style="margin-top:6px;opacity:.7">Click for details</div>`;
    positionTooltip(x, y);
    tt.classList.add('show');
    current = tile;
  }

  function hide() {
    tt.classList.remove('show');
    current = null;
  }

  function positionTooltip(x, y) {
    const pad = 14;
    let left = x + pad, top = y + pad;
    const rect = tt.getBoundingClientRect();
    if (left + rect.width > window.innerWidth - 8) left = x - rect.width - pad;
    if (top + rect.height > window.innerHeight - 8) top = y - rect.height - pad;
    tt.style.left = left + 'px';
    tt.style.top = top + 'px';
  }

  grid.addEventListener('mousemove', e => {
    const tile = e.target.closest('.tile');
    if (!tile) { hide(); return; }
    if (tile !== current) showFor(tile, e.clientX, e.clientY);
    else positionTooltip(e.clientX, e.clientY);
  });
  grid.addEventListener('mouseleave', hide);

  grid.addEventListener('focusin', e => {
    const tile = e.target.closest('.tile');
    if (!tile) return;
    const rect = tile.getBoundingClientRect();
    showFor(tile, rect.left + rect.width / 2, rect.top);
  });
  grid.addEventListener('focusout', hide);
}

function attachGridInteractions(grid) {
  grid.addEventListener('click', e => {
    const tile = e.target.closest('.tile');
    if (tile) openUnitModal(tile.dataset.tu);
  });
  grid.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const tile = e.target.closest('.tile');
    if (!tile) return;
    e.preventDefault();
    openUnitModal(tile.dataset.tu);
  });

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target.id === 'modalOverlay') closeModal();
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    closeModal();
    closeManageModal();
  });
}

let modalTu = null;

function openUnitModal(tu) {
  modalTu = tu;
  renderModalBody();
  document.getElementById('modalOverlay').hidden = false;
}

function closeModal() {
  modalTu = null;
  document.getElementById('modalOverlay').hidden = true;
}

/*
 * ── MANAGE MODAL (pick any unit, set/clear a manual override) ──────────
 * Separate from the per-tile detail modal above: opened via the header's
 * "Set unit status" button, or via "Set manually" / "Edit" inside a tile's
 * own detail modal (which pre-selects that tile's TU here). Lists every
 * currently-overridden unit so they're all visible and clearable in one
 * place, not just discoverable one tile at a time.
 */
let manageSelectedTu = null;

function initManageModal() {
  document.getElementById('manualBtn').addEventListener('click', () => openManageModal());
  document.getElementById('manageClose').addEventListener('click', closeManageModal);
  document.getElementById('manageOverlay').addEventListener('click', e => {
    if (e.target.id === 'manageOverlay') closeManageModal();
  });
}

function openManageModal(prefillTu) {
  manageSelectedTu = prefillTu || null;
  renderManageBody();
  document.getElementById('manageOverlay').hidden = false;
  if (prefillTu) {
    const input = document.getElementById('manageUnitInput');
    if (input) input.focus();
  } else {
    setTimeout(() => { const i = document.getElementById('manageUnitInput'); if (i) i.focus(); }, 0);
  }
}

function closeManageModal() {
  document.getElementById('manageOverlay').hidden = true;
}

function renderManageBody() {
  const body = document.getElementById('manageBody');
  const tu = manageSelectedTu;
  const localOv = tu ? manualOverrides[tu] : null;
  const liveOos = tu ? lastTuStatusByTu[tu] : null;
  const hasLiveOos = !!(liveOos && liveOos.stop);
  const knownTu = tu && lastUnitsByTu[tu];
  const back4appConfigured = !!(BACK4APP_CONFIG.appId && BACK4APP_CONFIG.jsKey);

  // What's currently set for this TU, from whichever source is
  // authoritative — see applyManualOverride() for the full precedence.
  const existingStatus = hasLiveOos ? 'out_of_service' : (localOv ? localOv.status : null);
  const existingDesc = hasLiveOos ? (liveOos.reason || '') : (localOv ? (localOv.description || '') : '');

  let html = `<div class="form-row">
    <label for="manageUnitInput">Unit</label>
    <input type="text" id="manageUnitInput" list="unitList" placeholder="e.g. AM103" value="${escapeAttr(tu || '')}" autocomplete="off">
  </div>`;

  if (tu && !knownTu) {
    html += `<div class="modal-error" style="margin-top:-6px">"${escapeHtml(tu)}" isn't in the current roster — check the code and try again.</div>`;
  } else if (tu) {
    html += `<div class="form-row">
      <label>Status</label>
      <div class="status-choice">
        <label class="sel-review"><input type="radio" name="manageStatus" value="review" ${existingStatus !== 'out_of_service' ? 'checked' : ''}> Review required</label>
        <label class="sel-oos"><input type="radio" name="manageStatus" value="out_of_service" ${existingStatus === 'out_of_service' ? 'checked' : ''}> Out of service</label>
      </div>
      ${back4appConfigured
        ? '<div style="opacity:.7;font-size:.85em;margin-top:6px">Out of service is saved to Back4App (TU_Status) — visible on every device. Review required stays local to this browser.</div>'
        : '<div style="opacity:.7;font-size:.85em;margin-top:6px">Back4App isn’t configured — both choices are local to this browser only (demo mode).</div>'}
    </div>
    <div class="form-row">
      <label for="manageDesc">Description (optional)</label>
      <textarea id="manageDesc" rows="2" maxlength="200" placeholder="Short note — why, and by whom, if useful">${escapeHtml(existingDesc)}</textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ack" id="manageSaveBtn" style="background:var(--focus);border-color:var(--focus);color:#03101f">
        ${existingStatus ? 'Update' : 'Set status'}
      </button>
      ${existingStatus ? '<button class="btn btn-unack" id="manageClearBtn">Clear</button>' : ''}
    </div>`;
  }

  // Bottom list: local overrides (review always; out_of_service only when
  // Back4App isn't configured — see applyManualOverride()) plus every live
  // TU_Status STOP=true record. A TU only ever shows up under one source at
  // a time given that precedence, but both are consulted so nothing is
  // silently left out of this list.
  const rows = [];
  Object.keys(manualOverrides).sort().forEach(t => {
    const ov = manualOverrides[t];
    if (ov.status === 'out_of_service' && back4appConfigured) return;
    rows.push({ tu: t, status: ov.status, desc: ov.description || '', source: 'local' });
  });
  Object.keys(lastTuStatusByTu).sort().forEach(t => {
    const st = lastTuStatusByTu[t];
    if (!st.stop) return;
    rows.push({ tu: t, status: 'out_of_service', desc: st.reason || '', source: 'tu_status' });
  });
  rows.sort((a, b) => a.tu.localeCompare(b.tu));

  html += '<div class="manage-list"><h3>Currently set manually</h3>';
  if (!rows.length) {
    html += '<div class="manage-empty">No units are manually overridden.</div>';
  } else {
    html += rows.map(r => {
      const label = STATUS_LABEL[r.status] || r.status;
      const sourceTag = r.source === 'tu_status' ? ' <span style="opacity:.6;font-weight:400">(Back4App)</span>' : '';
      return `<div class="manage-row">
        <span class="mr-tu">${escapeHtml(r.tu)}</span>
        <span class="mr-status ${escapeAttr(r.status)}">${escapeHtml(label)}${sourceTag}</span>
        <span class="mr-desc">${escapeHtml(r.desc)}</span>
        <button class="mr-clear" data-clear-tu="${escapeAttr(r.tu)}" data-clear-source="${r.source}">Clear</button>
      </div>`;
    }).join('');
  }
  html += '</div>';
  html += '<div class="modal-error" id="manageError" hidden></div>';

  body.innerHTML = html;

  const input = document.getElementById('manageUnitInput');
  input.addEventListener('change', () => {
    manageSelectedTu = input.value.trim().toUpperCase();
    renderManageBody();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); manageSelectedTu = input.value.trim().toUpperCase(); renderManageBody(); }
  });

  const saveBtn = document.getElementById('manageSaveBtn');
  if (saveBtn) saveBtn.addEventListener('click', () => handleManageSave(tu));
  const clearBtn = document.getElementById('manageClearBtn');
  if (clearBtn) clearBtn.addEventListener('click', () => handleManageClear(tu, hasLiveOos ? 'tu_status' : 'local'));
  body.querySelectorAll('[data-clear-tu]').forEach(btn => {
    btn.addEventListener('click', () => handleManageClear(btn.dataset.clearTu, btn.dataset.clearSource));
  });
}

// Saving "Out of service" while Back4App is configured writes straight to
// TU_Status (upsert — see setTuStatusStop()); everything else (review
// required always, or out_of_service in local-only demo mode) goes through
// the existing localStorage-backed manualOverrides path.
async function handleManageSave(tu) {
  const body = document.getElementById('manageBody');
  const status = body.querySelector('input[name="manageStatus"]:checked').value;
  const desc = document.getElementById('manageDesc').value;
  const saveBtn = document.getElementById('manageSaveBtn');
  const errEl = document.getElementById('manageError');
  if (errEl) errEl.hidden = true;

  const back4appConfigured = !!(BACK4APP_CONFIG.appId && BACK4APP_CONFIG.jsKey);

  if (status === 'out_of_service' && back4appConfigured) {
    if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving…'; }
    try {
      const existing = lastTuStatusByTu[tu];
      await setTuStatusStop(tu, true, desc, existing ? existing.object_id : null);
    } catch (err) {
      console.error('Failed to save TU_Status:', err);
      if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = 'Set status'; }
      if (errEl) {
        errEl.hidden = false;
        errEl.innerHTML =
          `Couldn't save to Back4App: ${escapeHtml(err.message)}.<br>` +
          `Make sure the JavaScript Key has <strong>create</strong> and <strong>update</strong> permission on ` +
          `<code>TU_Status</code> in its Class-Level Permissions.`;
      }
      return;
    }
  } else {
    setManualOverride(tu, status, desc);
  }

  await loadFleet();
  renderManageBody();
}

// source is 'tu_status' (flips STOP back to false on the existing TU_Status
// record, keeping REASON as history) or 'local' (clearManualOverride, same
// as before this feature).
async function handleManageClear(tu, source) {
  const errEl = document.getElementById('manageError');
  if (errEl) errEl.hidden = true;

  if (source === 'tu_status') {
    const existing = lastTuStatusByTu[tu];
    try {
      await setTuStatusStop(tu, false, existing ? existing.reason : '', existing ? existing.object_id : null);
    } catch (err) {
      console.error('Failed to clear TU_Status:', err);
      if (errEl) {
        errEl.hidden = false;
        errEl.innerHTML = `Couldn't clear in Back4App: ${escapeHtml(err.message)}.`;
      }
      return;
    }
  } else {
    clearManualOverride(tu);
  }

  await loadFleet();
  renderManageBody();
}

function renderModalBody() {
  const u = lastUnitsByTu[modalTu];
  const body = document.getElementById('modalBody');
  if (!u) { closeModal(); return; }

  const rawStatus = u.raw_status || u.status;
  const hasFault = rawStatus === 'failure' || rawStatus === 'review' || rawStatus === 'maintenance';
  const statusLabel = STATUS_LABEL[rawStatus] || rawStatus;
  const activeAlarms = (u.alarms || []).filter(a => !a.acknowledged);

  let html = `<h2 class="modal-tu" id="modalTu">${escapeHtml(u.tu)}</h2>`;
  html += `<div class="modal-status ${escapeAttr(rawStatus)}">${escapeHtml(statusLabel)}${u.manual ? ' · manual' : ''}${u.tu_status ? ' · Back4App' : ''}</div>`;

  if (u.tu_status) {
    html += `<div class="modal-detail">
      <div class="code">Out of service</div>
      ${u.tu_status_reason ? `<div class="msg">${escapeHtml(u.tu_status_reason)}</div>` : ''}
      <div class="msg" style="margin-top:6px;opacity:.7">From Back4App (TU_Status) — visible on every device.</div>
    </div>`;

    if (u.underlying) {
      const ulabel = STATUS_LABEL[u.underlying.raw_status] || u.underlying.raw_status;
      html += `<div class="underlying-block">
        <strong>Live status underneath:</strong> ${escapeHtml(ulabel)}${u.underlying.acknowledged ? ' (acknowledged)' : ''}
        ${u.underlying.alert_code ? `<br>${escapeHtml(u.underlying.alert_code)}${u.underlying.alert_message ? ' — ' + escapeHtml(u.underlying.alert_message) : ''}` : ''}
      </div>`;
    }
  } else if (u.manual) {
    const manualLabel = rawStatus === 'out_of_service' ? 'Manually out of service' : 'Manually flagged for review';
    html += `<div class="modal-detail">
      <div class="code">${escapeHtml(manualLabel)}</div>
      ${u.manual_description ? `<div class="msg">${escapeHtml(u.manual_description)}</div>` : ''}
      ${u.manual_set_at ? `<div class="msg" style="margin-top:6px;opacity:.7">Set ${escapeHtml(new Date(u.manual_set_at).toLocaleString())} — Local to this browser, not synced to Back4App.</div>` : ''}
    </div>`;

    if (u.underlying) {
      const ulabel = STATUS_LABEL[u.underlying.raw_status] || u.underlying.raw_status;
      html += `<div class="underlying-block">
        <strong>Live status underneath:</strong> ${escapeHtml(ulabel)}${u.underlying.acknowledged ? ' (acknowledged)' : ''}
        ${u.underlying.alert_code ? `<br>${escapeHtml(u.underlying.alert_code)}${u.underlying.alert_message ? ' — ' + escapeHtml(u.underlying.alert_message) : ''}` : ''}
      </div>`;
    }
  } else if (hasFault && activeAlarms.length > 1) {
    // Several active alarms on this unit — list all of them, not just the
    // one (worst) driving the tile's own color/status.
    html += `<div class="modal-alarm-list">` + activeAlarms.map(a => `
      <div class="modal-detail">
        <div class="alarm-sev ${escapeAttr(a.status)}">${escapeHtml(STATUS_LABEL[a.status] || a.status)}</div>
        <div class="code">${escapeHtml(a.alert_code || 'Active alarm')}</div>
        <div class="msg">${escapeHtml(a.alert_message || 'No further detail available.')}</div>
      </div>`).join('') + `</div>`;
  } else if (hasFault) {
    html += `<div class="modal-detail">
      <div class="code">${escapeHtml(u.alert_code || 'Active alarm')}</div>
      <div class="msg">${escapeHtml(u.alert_message || 'No further detail available.')}</div>
    </div>`;
  } else {
    html += `<div class="modal-empty">No active fault on this unit.</div>`;
  }

  if (u.acknowledged) {
    html += `<div class="modal-ack-note">✓ Acknowledged${!BACK4APP_CONFIG.appId ? ' (demo — not saved)' : ''}</div>`;
  }

  html += '<div class="modal-actions">';
  if (u.manual || u.tu_status) {
    html += `<button class="btn btn-unack" id="modalClearManualBtn">Clear ${u.tu_status ? 'out-of-service' : 'manual'} status</button>`;
    html += `<button class="btn" id="modalEditManualBtn">Edit</button>`;
  } else {
    if (hasFault || u.acknowledged) {
      const willAck = !u.acknowledged;
      const ackLabel = willAck
        ? (activeAlarms.length > 1 ? `Acknowledge worst alarm (1 of ${activeAlarms.length})` : 'Acknowledge fault')
        : 'Un-acknowledge';
      html += `<button class="btn ${willAck ? 'btn-ack' : 'btn-unack'}" id="modalAckBtn">
        ${ackLabel}
      </button>`;
    }
    html += `<button class="btn" id="modalSetManualBtn">Set manually</button>`;
  }
  html += '</div>';
  html += `<button class="btn" id="modalCancelBtn" style="width:100%;margin-top:10px">Close</button>`;
  html += '<div class="modal-error" id="modalError" hidden></div>';

  body.innerHTML = html;

  document.getElementById('modalCancelBtn').addEventListener('click', closeModal);
  const ackBtn = document.getElementById('modalAckBtn');
  if (ackBtn) ackBtn.addEventListener('click', () => handleAcknowledge(u));
  const setManualBtn = document.getElementById('modalSetManualBtn');
  if (setManualBtn) setManualBtn.addEventListener('click', () => { closeModal(); openManageModal(u.tu); });
  const editManualBtn = document.getElementById('modalEditManualBtn');
  if (editManualBtn) editManualBtn.addEventListener('click', () => { closeModal(); openManageModal(u.tu); });
  const clearManualBtn = document.getElementById('modalClearManualBtn');
  if (clearManualBtn) clearManualBtn.addEventListener('click', async () => {
    if (u.tu_status) {
      clearManualBtn.disabled = true;
      clearManualBtn.textContent = 'Clearing…';
      try {
        await setTuStatusStop(u.tu, false, u.tu_status_reason || '', u.tu_status_object_id || null);
      } catch (err) {
        console.error('Failed to clear TU_Status:', err);
        clearManualBtn.disabled = false;
        clearManualBtn.textContent = 'Clear out-of-service status';
        return;
      }
    } else {
      clearManualOverride(u.tu);
    }
    await loadFleet();
    closeModal();
  });
}

async function handleAcknowledge(u) {
  const ackBtn = document.getElementById('modalAckBtn');
  const errEl = document.getElementById('modalError');
  errEl.hidden = true;
  if (ackBtn) { ackBtn.disabled = true; ackBtn.textContent = 'Saving…'; }

  const newValue = !u.acknowledged;

  try {
    const result = await updateLiveAlarmAcknowledged(u.object_id, newValue);
    if (!result.persisted) {
      const alarmKey = u.alarm_key || u.alert_code || u.status;
      localAckOverrides[u.tu + '|' + alarmKey] = newValue;
    }
    await loadFleet();
    if (modalTu === u.tu) renderModalBody();
  } catch (err) {
    console.error('Failed to save acknowledgement:', err);
    if (ackBtn) { ackBtn.disabled = false; ackBtn.textContent = newValue ? 'Acknowledge fault' : 'Un-acknowledge'; }
    errEl.hidden = false;
    errEl.innerHTML =
      `Couldn't save to Back4App: ${escapeHtml(err.message)}.<br>` +
      `Make sure the JavaScript Key has <strong>update</strong> permission on ` +
      `<code>Live_Alarms</code> in its Class-Level Permissions — see README.md → "Acknowledging faults".`;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

initManageModal();
initDailyResetButton();
initTabs();
loadFleet();
</script>
</body>
</html>

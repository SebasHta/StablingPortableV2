# =============================================================================
# nginx config for the Depot Control container
# -----------------------------------------------------------------------------
# The point of this file: HTML must NEVER be cached by the browser.
#
# Without these headers a browser can keep serving a stored copy of
# main-hub.html for days, so a user opens the app and sees an old version with
# no way of knowing. Everything else (version.json especially) must also be
# revalidated, because it is what tells a stale page that it is stale.
#
# Deploy: replace the container's default.conf with this, then redeploy.
# =============================================================================

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Health check used by the container platform.
    location = / {
        if ($request_method = OPTIONS) { return 200; }
        try_files /index.html =404;
    }

    # --- Retired filename ---------------------------------------------------
    # The app used to be served as depot-train-locations.html (last build v4.8).
    # The file is gone; this redirect means old bookmarks reach the current app
    # instead of a 404 — and it can never serve stale application code, because
    # there is no longer a file there to serve.
    location = /depot-train-locations.html {
        return 301 /main-hub.html;
    }

    # --- HTML: always revalidate -------------------------------------------
    # must-revalidate + no-cache means the browser may keep a copy but has to
    # ask the server whether it is still current on every single load. If it
    # is, nginx answers 304 (cheap); if not, the new file is sent.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # --- version.json: never cached ----------------------------------------
    # This is the file the running app polls to discover it is out of date.
    # A cached copy would defeat the whole mechanism.
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        default_type application/json;
    }

    # --- Everything else ----------------------------------------------------
    # Static assets are safe to cache briefly; they are versioned by URL
    # (?v=) wherever the app loads them.
    location / {
        try_files $uri $uri/ =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
